<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | My Store</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}"
    >

</head>

<body>


    <nav class="navbar">

        <div class="logo">
            My Store
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                Cart
            </a>

            <a href="/login">
                Login
            </a>

        </div>

    </nav>


    <main class="container account-auth-page">

        <section class="account-auth-card">


            <p class="small-label">
                NEW CUSTOMER
            </p>


            <h1>
                Create Account
            </h1>


            <p class="account-auth-subtitle">
                Create an account to manage your orders.
            </p>


            <div
                class="account-error"
                th:if="${error != null}"
                th:text="${error}"
            >
                Error
            </div>


            <form
                action="/register"
                method="post"
            >


                <div class="form-grid">


                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            id="firstName"
                            name="firstName"
                            type="text"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            id="lastName"
                            name="lastName"
                            type="text"
                            required
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            minlength="6"
                            required
                        >

                    </div>


                </div>


                <button
                    class="account-submit-button"
                    type="submit"
                >
                    Create Account
                </button>


            </form>


            <p class="account-switch">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>


        </section>

    </main>


    <footer class="footer">
        © 2026 My Store
    </footer>


</body>

</html>
