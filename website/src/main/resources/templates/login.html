<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | My Store</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}"
    >

</head>

<body>


    <nav class="navbar">

        <a
            href="/"
            class="logo"
        >
            My Store
        </a>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                Cart
            </a>

            <a href="/register">
                Register
            </a>

        </div>

    </nav>


    <main class="container account-auth-page">

        <section class="account-auth-card">


            <p class="small-label">
                WELCOME BACK
            </p>


            <h1>
                Login
            </h1>


            <p class="account-auth-subtitle">
                Login to access your account.
            </p>


            <div
                class="account-error"
                th:if="${error != null}"
                th:text="${error}"
            >
                Invalid email or password.
            </div>


            <form
                action="/login"
                method="post"
            >


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group login-password">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    class="account-submit-button"
                    type="submit"
                >
                    Login
                </button>


            </form>


            <p class="account-switch">

                Don't have an account?

                <a href="/register">
                    Create one
                </a>

            </p>


        </section>

    </main>


    <footer class="footer">
        © 2026 My Store
    </footer>


</body>

</html>
