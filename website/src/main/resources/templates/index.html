<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Store</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}"
    >

</head>

<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <a
            href="/"
            class="logo"
        >
            My Store
        </a>


        <div class="nav-links">


            <a href="/">
                Home
            </a>


            <a href="/products">
                Products
            </a>


            <a href="/cart">
                Cart
            </a>


            <a href="/orders">
                Orders
            </a>


            <!-- NOT LOGGED IN -->

            <a
                href="/login"
                th:if="${!loggedIn}"
            >
                Login
            </a>


            <a
                href="/register"
                th:if="${!loggedIn}"
            >
                Register
            </a>


            <!-- LOGGED IN -->

            <a
                href="/account"
                class="account-nav-link"
                th:if="${loggedIn}"
            >

                My Account

                <span
                    th:if="${customerName != null}"
                    th:text="'(' + ${customerName} + ')'"
                >
                    (Customer)
                </span>

            </a>


        </div>

    </nav>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <div class="hero-content">


            <!-- LOGGED OUT -->

            <h1 th:if="${!loggedIn}">
                Welcome to My Store
            </h1>


            <!-- LOGGED IN -->

            <h1 th:if="${loggedIn}">

                Welcome,

                <span
                    th:text="${customerName}"
                >
                    Customer
                </span>

            </h1>


            <p>
                Shop our latest products powered by
                WooCommerce and Spring Boot.
            </p>


            <a
                href="/products"
                class="btn"
            >
                Shop Now
            </a>


        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        © 2026 My Store

    </footer>


</body>

</html>
